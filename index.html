<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NO MONEY, NO LIFE</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

</head>


<body>


    <!-- =========================
         メインゲーム画面
    ========================= -->

    <div class="game-container">

        <h1 class="game-title">
            NO MONEY, NO LIFE
        </h1>

        <p class="game-subtitle">
            ようこそ資本至上主義異世界へ。
        </p>

        <button id="startButton">
            ゲームを始める
        </button>

    </div>


    <!-- =========================
         ゴールドルーレット
    ========================= -->

    <div
        id="goldRoulette"
        class="gold-roulette"
    >

        <div class="gold-roulette-title">
            💰 獲得ゴールド
        </div>

        <div
            id="goldRouletteNumber"
            class="gold-roulette-number"
        >
            0G
        </div>

    </div>


</div>

    <!-- =========================
         モンスター遭遇選択
    ========================= -->

    <div
        id="monsterChoicePopup"
        class="monster-choice-popup"
    >

        <div class="monster-choice-title">
            👾 モンスター出現！
        </div>

        <div
            id="monsterChoiceMessage"
            class="monster-choice-message"
        >
            どうする？
        </div>

        <div class="monster-choice-buttons">

            <button
                id="monsterFightButton"
                class="monster-choice-button"
            >
                ⚔️ 戦う
            </button>

            <button
                id="monsterEscapeButton"
                class="monster-choice-button"
            >
                🏃 逃げる
            </button>

        </div>

    </div>


    <!-- =========================
         モンスター戦闘
    ========================= -->

    <div
        id="battlePopup"
        class="battle-popup"
    >

        <div class="battle-title">
            ⚔️ モンスターバトル
        </div>


        <div
            id="battleRound"
            class="battle-round"
        >
            ROUND 1 / 3
        </div>


        <div class="battle-status">


            <!-- プレイヤー -->

            <div class="battle-player">

                <div
                    id="battlePlayerName"
                    class="battle-name"
                >
                    A
                </div>

                <div id="battlePlayerStats">

                    💰500G<br>
                    ⚔️100<br>
                    🛡️100

                </div>

            </div>


            <!-- VS -->

            <div class="battle-vs">
                VS
            </div>


            <!-- モンスター -->

            <div class="battle-monster">

                <div
                    id="battleMonsterName"
                    class="battle-name"
                >
                    👾 ゴブリン
                </div>

                <div id="battleMonsterStats">

                    ❤️150<br>
                    ⚔️120<br>
                    🛡️20

                </div>

            </div>

        </div>


        <!-- 戦闘メッセージ -->

        <div
            id="battleMessage"
            class="battle-message"
        >
            戦闘開始！
        </div>


        <!-- 攻撃ボタン -->

        <button
            id="battleAttackButton"
            class="battle-attack-button"
        >
            ⚔️ 攻撃する
        </button>

<button
    id="battleMagicButton"
    class="battle-magic-button"
>
    🔮 魔法
</button>

    </div>

<!-- =========================
     戦闘中の魔法選択
========================= -->

<div
    id="battleMagicPopup"
    class="battle-magic-popup"
>

    <div class="battle-magic-title">
        🔮 魔法
    </div>


    <div
        id="battleMagicList"
        class="battle-magic-list"
    ></div>


    <button
        id="battleMagicCloseButton"
        class="battle-magic-close-button"
    >
        閉じる
    </button>

</div>

    <!-- =========================
         バイト選択
    ========================= -->

    <div
        id="jobPopup"
        class="job-popup"
    >

        <div class="job-title">
            💼 バイト
        </div>

        <div
            id="jobMessage"
            class="job-message"
        >
            ここで働くことができます。
        </div>

        <div class="job-choices">

            <button
                id="job1Button"
                class="job-choice-button"
            >
                💼 1ターン働く
                <span>＋1000G</span>
            </button>

            <button
                id="job2Button"
                class="job-choice-button"
            >
                💼 2ターン働く
                <span>＋2500G</span>
            </button>

            <button
                id="job3Button"
                class="job-choice-button"
            >
                💼 3ターン働く
                <span>＋6000G</span>
            </button>

            <button
                id="jobNoneButton"
                class="job-choice-button"
            >
                🏃 働かない
            </button>

        </div>

    </div>


    <!-- =========================
         イベントポップアップ
    ========================= -->

    <div
        id="eventPopup"
        class="event-popup"
    >

        <div class="event-popup-title">
            💰 イベント
        </div>

        <div
            id="eventPopupMessage"
            class="event-popup-message"
        ></div>

        <button
            id="eventPopupButton"
            class="event-popup-button"
        >
            OK
        </button>

    </div>


    <!-- =========================
         報酬選択
    ========================= -->

    <div
        id="rewardPopup"
        class="reward-popup"
    >

        <div class="reward-title">
            🎁 報酬を選択
        </div>

        <div
            id="rewardMessage"
            class="reward-message"
        >
            報酬を1つ選んでください
        </div>

        <div
            id="rewardChoices"
            class="reward-choices"
        ></div>

    </div>


    <!-- =========================
     サイコロルーレット
    ========================= -->

<div
    id="diceRoulette"
    class="dice-roulette"
>

    <div class="dice-roulette-title">
        🎲 サイコロ
    </div>

    <div
        id="diceRouletteNumber"
        class="dice-roulette-number"
    >
        1
    </div>

</div>


<!-- =========================
     アイテム用 複数サイコロルーレット
========================= -->

<div
    id="multiDiceRoulette"
    class="multi-dice-roulette"
>

    <div class="multi-dice-title">
        🎲 サイコロ
    </div>

    <div
        id="multiDiceNumbers"
        class="multi-dice-numbers"
    ></div>

    <div
        id="multiDiceTotal"
        class="multi-dice-total"
    ></div>

</div>


    <!-- =========================
         アイテム画面
    ========================= -->

    <div
        id="inventoryPopup"
        class="inventory-popup"
    >

        <div class="inventory-title">
            🎒 アイテム
        </div>

        <div
            id="inventoryList"
            class="inventory-list"
        ></div>

        <button
            id="inventoryCloseButton"
            class="inventory-close-button"
        >
            閉じる
        </button>

    </div>

<!-- =========================
     所持品画面
========================= -->

<div
    id="possessionPopup"
    class="inventory-popup"
>

    <div class="inventory-popup-title">
        🏆 所持品
    </div>

    <div
        id="possessionList"
        class="inventory-list"
    ></div>

    <button
        id="possessionCloseButton"
        class="inventory-close-button"
        type="button"
    >
        閉じる
    </button>

</div>


    <!-- =========================
         魔法画面
    ========================= -->

    <div
        id="magicPopup"
        class="magic-popup"
    >

        <div class="magic-title">
            🔮 魔法
        </div>

        <div
            id="magicList"
            class="magic-list"
        ></div>

        <button
            id="magicCloseButton"
            class="magic-close-button"
        >
            閉じる
        </button>

    </div>

    <!-- =========================
     魔法ショップ
========================= -->

<div
    id="magicShopPopup"
    class="magic-shop-popup"
>

    <div class="magic-shop-title">
        🔮 魔法屋
    </div>


    <div
        id="magicShopMoney"
        class="magic-shop-money"
    >
        💰 所持金：0G
    </div>


    <div
        id="magicShopList"
        class="magic-shop-list"
    ></div>


    <button
        id="magicShopCloseButton"
        class="magic-shop-close-button"
    >
        🏃 やめる
    </button>

</div>

    <!-- =========================
         最終結果
    ========================= -->

    <div
        id="resultPopup"
        class="result-popup"
    >

        <div class="result-title">
            🏁 GAME OVER
        </div>

        <div class="result-subtitle">
            🎉 冒険終了！
        </div>

        <div
            id="resultRanking"
            class="result-ranking"
        ></div>

        <button
            id="resultButton"
            class="result-button"
        >
            🏠 タイトルにもどる
        </button>

    </div>


    <!-- =========================
         JavaScript
    ========================= -->

    <script src="game.js"></script>

    <div 
id="itemRoulette"
 class="item-roulette">

    <div class="item-roulette-title">
        🎁 宝箱
    </div>
    
    <div id="itemRouletteName" 
    class="item-roulette-name">---
</div>

</body>

</html>
